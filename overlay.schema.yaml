# overlay.schema.yaml — reference schema for `.harness-overlay/overlay.yaml`
# Copy block below vào `.harness-overlay/overlay.yaml` của product và điền giá trị.
# Keys đánh dấu REQUIRED bắt buộc; keys khác optional có default.

harness_version: ">=0.1.0"            # REQUIRED. Semver range cho upstream version.

product:
  name: ""                            # REQUIRED. CamelCase, ví dụ: YourProduct
  package: ""                         # REQUIRED. Reverse-DNS, ví dụ: com.yourcompany.product
  app_display_name: ""                # Optional. Hiển thị user-facing, default = product.name

modules:
  app: composeApp                     # Entry module (compose-multiplatform convention). Thay đổi nếu khác.
  presenter: presenter                # UI + MVI + Navigation module
  domain: domain                      # Pure Kotlin domain module
  data: data                          # Repo impl + DTO + mapper module

ui:
  theme_prefix: ""                    # REQUIRED. Ví dụ: Acme → sinh ra AcmeColors, AcmeTypography...
  theme_class: ""                     # REQUIRED. Ví dụ: AcmeTheme (object/composable wrapper)

stack:
  ui: compose-multiplatform           # Options: compose-multiplatform | compose-android | xml-android
  mvi: BaseViewModel                  # Base ViewModel class name
  di: koin                            # Options: koin | hilt | manual
  network: ktor                       # Options:
                                      #   - ktor      (KMP/CMP; prefer khi share code iOS/desktop)
                                      #   - ktorfit   (KMP + Retrofit-style annotation; type-safe interface)
                                      #   - retrofit  (Android-only; mature, OkHttp ecosystem)
  database: sqldelight                # Options:
                                      #   - sqldelight (KMP + Android; generated typed Kotlin API)
                                      #   - room       (Android native; KMP support từ 2.7+; annotation-based)
                                      #   - datastore  (Preferences + Proto; key-value, không relational)
                                      #   - none       (in-memory / filesystem only)
  image: coil                         # Options: coil | glide | kamel | none
  serialization: kotlinx-serialization   # Options: kotlinx-serialization | moshi | gson

features_root: feature                # Package segment under presenter/.../ containing features

targets:                              # Platform targets
  - android
  - ios                               # Remove if Android-only

min_sdk: 24
ios_min: "15.0"
kotlin_version: "2.x"
compose_version: "1.8+"

platform_sdks:                        # Imports chỉ được xuất hiện trong data/{androidMain,iosMain}
  - androidx.media3
  - platform.AVFoundation
  - com.google.firebase
  - com.revenuecat

forbidden_imports_in_domain:          # Thêm vào ARCH-001 check
  - android.
  - androidx.
  - platform.
  - com.google.firebase.
  - com.revenuecat.
  - io.ktor.client.engine.

reference_blueprint:
  feature_name: ""                    # Optional. Live feature trong codebase làm blueprint, vd: bookdetail.
  path: ""                            # Path relative project root tới feature package.
                                      # Để trống → agent fallback upstream/blueprints/reference-feature/

profile: app                          # Options: app | sdk-library | multiplatform-library
                                      # 'sdk-library' bật MOD-001..003 lên MUST + binary-compat gate.

architecture:
  profile: cmp                        # REQUIRED. Target architecture school. Options:
                                      #   - cmp          (Compose Multiplatform: shared UI + logic qua expect/actual)
                                      #   - kmp          (Kotlin Multiplatform: shared logic, native UI SwiftUI/Compose Android)
                                      #   - android-only (Jetpack Compose Android, single platform)
                                      # Profile tune rule applicability (ARCH-010 platform SDK boundary, 5-states coverage, etc.)

rule_overrides:                       # Optional. Override severity hoặc disable rule MUST.
                                      # Mỗi override PHẢI có rationale ≥ 50 ký tự giải thích tại sao.
                                      # Install validate; thiếu rationale → fail install.
  # Examples (uncomment để dùng):
  #
  # - rule: ARCH-008                  # 5 UI states coverage
  #   severity: SHOULD                # Downgrade từ MUST → SHOULD
  #   rationale: "Settings screen app không có remote data; 5-state coverage over-strict cho context này."
  #
  # - rule: ARCH-007                  # ViewModel extends BaseViewModel
  #   disabled: true
  #   rationale: "Team dùng pure Compose state hoisting pattern, không MVI, nên BaseViewModel không áp dụng."
  #
  # - rule: MOD-001                   # Future-SDK Discipline
  #   severity: MAY
  #   rationale: "Product chưa có plan extract feature SDK, bật discipline sớm là over-engineering."

enforcement:
  mode: strict                        # Options:
                                      #   - strict   (fail CI khi violation; default, khuyến nghị cho production)
                                      #   - advisory (warn only, không fail CI; dùng khi mới migrate hoặc evaluation phase)

detekt:
  enabled: true
  baseline_file: "detekt-baseline.xml"

konsist:
  enabled: true
  test_module: ""                     # Module chứa Konsist test, default = presenter

product_extensions:
  constitution_dir: "constitution"    # Thư mục overlay chứa product-specific rule
  blueprints_dir: "blueprints"
  evaluations_dir: "evaluations"
